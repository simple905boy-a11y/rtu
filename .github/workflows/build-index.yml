name: Build search index & deploy site

on:
  workflow_dispatch:
  push:
    # Only the default branch builds: it is the branch Pages deploys from, and a
    # second branch building in parallel just cancels this one via the shared
    # concurrency group below.
    branches: [main]
  schedule:
    # Rebuild monthly so the index tracks upstream corrections.
    # (Scheduled runs only fire once this workflow is on the default branch.)
    - cron: "0 3 1 * *"

permissions:
  contents: write   # publishes the built index to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm install --no-fund --no-audit

      # Embedding ~69k hadith takes ~20 min, so keep the result for the rest of
      # the month. Re-running (e.g. after a deploy-only failure) then costs seconds.
      - name: Cache period
        id: period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore built index
        id: index-cache
        uses: actions/cache/restore@v4
        with:
          path: _site/data
          key: almiftah-index-${{ steps.period.outputs.month }}-${{ hashFiles('pipeline/build.mjs') }}

      - name: Build index (Shia mirror + semantic embeddings)
        if: steps.index-cache.outputs.cache-hit != 'true'
        working-directory: pipeline
        run: node build.mjs --out ../_site/data

      # Saved immediately after the build, not as a post-job step: a failure in a
      # later step (e.g. publishing) must not discard 20 minutes of embedding work.
      - name: Save built index
        if: steps.index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _site/data
          key: almiftah-index-${{ steps.period.outputs.month }}-${{ hashFiles('pipeline/build.mjs') }}

      # Publishes the index to a standalone `data` branch, which the free jsDelivr
      # CDN serves. The app falls back to that source, so it works even when
      # GitHub Pages is unavailable. Force-pushed as a single orphan commit so the
      # branch never accumulates old copies of the index.
      - name: Publish index to data branch
        run: |
          cd _site/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Search index built $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble site
        run: |
          cp index.html _site/
          cp -r css js _site/

      # Keeps the built index downloadable even if the Pages publish step fails.
      - uses: actions/upload-artifact@v4
        with:
          name: almiftah-site
          path: _site
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

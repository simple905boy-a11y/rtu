name: List available sources

# Diagnostic only: prints which hadith collections, tafsir editions and Qur'an
# translations the free sources currently offer, so additions can be planned
# against what actually exists. Reads nothing, writes nothing, deploys nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/list-sources.mjs
      - .github/workflows/list-sources.yml

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pipeline/list-sources.mjs
